name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache git libffi-dev libssl-dev build-essential python3-dev libltdl-dev cython3

    - name: Build with Buildozer
      uses: aksai-sd/buildozer-action@v1.4.0
      with:
        command: buildozer -v android debug
        submodule: false

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CifcilerHesaplayici-APK
        path: bin/*.apk
